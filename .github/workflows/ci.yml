name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node:
    name: Engine, plugins & e2e (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run e2e
        env:
          NO_COLOR: "1"

  jetbrains:
    name: JetBrains plugin (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/jetbrains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test buildPlugin --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: copal-jetbrains-plugin
          path: plugins/jetbrains/build/distributions/*.zip

  docker:
    name: Hosted backend (Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t copal-mock .
      - name: Smoke test
        run: |
          docker run -d --name copal -p 4010:4010 -e COPAL_MOCK_DEV_KEY=ci-key copal-mock
          for i in $(seq 1 30); do curl -sf localhost:4010/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4010/v1/status)" = 401
          curl -sf localhost:4010/v1/status -H 'x-api-key: ci-key' | grep -q billing-api
          docker logs copal
