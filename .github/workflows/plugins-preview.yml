name: plugins-preview
# Builds the VS Code and IntelliJ plugins from main and attaches them to the "plugins-preview" pre-release,
# so they can be tried (for example in a Codespace) without publishing to a marketplace.
on:
  push:
    branches: [main]
    paths: ["packages/core/**", "packages/vscode-extension/**", "plugins/jetbrains/**", ".github/workflows/plugins-preview.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: plugins-preview, cancel-in-progress: true }

jobs:
  vscode:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: bash packages/vscode-extension/scripts-package.sh
      - name: Publish to the plugins-preview pre-release
        run: |
          cp packages/vscode-extension/*.vsix copal-vscode.vsix
          gh release view plugins-preview >/dev/null 2>&1 || gh release create plugins-preview --prerelease --title "Plugins preview (latest main)" --notes "Built from main on every change. Not published to any marketplace." --target main
          gh release upload plugins-preview copal-vscode.vsix --clobber

  jetbrains:
    runs-on: ubuntu-latest
    needs: vscode
    defaults:
      run: { working-directory: plugins/jetbrains }
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew buildPlugin --no-daemon
      - run: cp build/distributions/*.zip copal-intellij.zip && gh release upload plugins-preview copal-intellij.zip --clobber
