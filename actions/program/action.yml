name: Copal
description: "Copal in your own CI: questions and a reviewer guide on each change, a weekly team report, and the readiness diagnostic. Your code stays in your runner."
branding: { icon: check-circle, color: green }
inputs:
  mode:
    description: "auto (pull request → check; schedule → weekly report), check, weekly or readiness"
    default: auto
  track:
    description: "Your situation: new-products, legacy or agents. Picks which practices come first."
    default: ""
  days:
    description: "Readiness only: how many days of history to read"
    default: "90"
  sarif:
    description: "Check mode: SARIF files from scanners you already run (CodeQL, Semgrep, ESLint…), comma-separated. Their findings join Copal's ranking, baseline and gate."
    default: ""
  report-label:
    description: "Label of the GitHub issue that holds each report"
    default: copal-report
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: 22 }
    - name: Build Copal
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: |
        log="$(mktemp)"
        if ! { npm install --no-audit --no-fund --loglevel=error && npx tsc -b packages/core packages/client packages/cli packages/git-app; } >"$log" 2>&1; then
          cat "$log"; echo "::error title=Copal build failed::$(tail -c 1500 "$log" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1
        fi
    - name: Run
      shell: bash
      env:
        COPAL: ${{ github.action_path }}/../..
        MODE: ${{ inputs.mode }}
        TRACK: ${{ inputs.track }}
        DAYS: ${{ inputs.days }}
        LABEL: ${{ inputs.report-label }}
        COPAL_SARIF: ${{ inputs.sarif }}
        GH_TOKEN: ${{ env.GITHUB_TOKEN || github.token }}
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN || github.token }}
      run: bash "$COPAL/actions/program/run.sh"
